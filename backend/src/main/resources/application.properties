spring.application.name=api

server.port=${SERVER_PORT:8081}
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=never

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3307/duckhat?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:duckhat_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:duckhat_pass}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=${SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL:true}
spring.jpa.open-in-view=false

jwt.secret=${JWT_SECRET:ZHVja2hhdC1zdXBlci1zZWNyZXQta2V5LWR1Y2toYXQtMjAyNi1zZWd1cmE=}
jwt.expiration=${JWT_EXPIRATION:3600000}
app.auth.return-reset-code=${APP_AUTH_RETURN_RESET_CODE:false}
app.email.enabled=${APP_EMAIL_ENABLED:true}
app.email.host=${APP_EMAIL_HOST:}
app.email.port=${APP_EMAIL_PORT:587}
app.email.username=${APP_EMAIL_USERNAME:}
app.email.password=${APP_EMAIL_PASSWORD:}
app.email.from=${APP_EMAIL_FROM:no-reply@duckhat.local}
app.email.from-name=${APP_EMAIL_FROM_NAME:DuckHat}
app.email.auth=${APP_EMAIL_AUTH:true}
app.email.ssl=${APP_EMAIL_SSL:false}
app.email.start-tls=${APP_EMAIL_START_TLS:true}
app.email.connect-timeout-ms=${APP_EMAIL_CONNECT_TIMEOUT_MS:10000}
app.email.read-timeout-ms=${APP_EMAIL_READ_TIMEOUT_MS:10000}
app.chat.cleanup-cron=${APP_CHAT_CLEANUP_CRON:0 20 3 * * *}
